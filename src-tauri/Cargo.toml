[package]
name = "dedup"
version = "0.1.0"
description = "Detect and merge near-duplicate React components"
authors = ["Sadaf Kasim (GetBega Tech)"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dedup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP→HTTPS canvas tunnel for self-signed dev servers
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "macros"] }
native-tls = "0.2"
tokio-native-tls = "0.3"

# Launch-screen thumbnails are base64 data URLs over the IPC boundary.
base64 = "0.22"
# Decoding our own WKWebView snapshots for the visual gate + similarity pass
# (see visual.rs) — pure Rust, so the comparison is testable off a real screen.
png = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# WKWebView self-snapshot for project thumbnails (see thumbs.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSGeometry", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSGraphics", "NSImage", "NSImageRep", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", features = ["WKNavigation", "WKPDFConfiguration", "WKSnapshotConfiguration", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "block2", "objc2-app-kit"] }

[dev-dependencies]
rcgen = "0.13"
# test-only TLS server; SecureTransport can't import rcgen's PKCS8 ECDSA keys
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
