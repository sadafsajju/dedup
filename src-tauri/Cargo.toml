[package]
name = "dedup"
version = "0.1.0"
description = "Detect and merge near-duplicate React components"
authors = ["Sadaf Kasim (GetBega Tech)"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dedup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP→HTTPS canvas tunnel for self-signed dev servers
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "macros"] }
native-tls = "0.2"
tokio-native-tls = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.13"
# test-only TLS server; SecureTransport can't import rcgen's PKCS8 ECDSA keys
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
